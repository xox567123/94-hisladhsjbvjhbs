    :root {
      --neon: #39ff14;
      --neon-dark: #13c900;
      --bg: #020602;
      --panel: rgba(8, 24, 10, 0.92);
      --panel-light: rgba(57, 255, 20, 0.08);
      --border: rgba(57, 255, 20, 0.35);
      --text-muted: #9ac49d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: white;
      background:
        radial-gradient(circle at 50% -10%, rgba(57, 255, 20, 0.2), transparent 35%),
        linear-gradient(135deg, #010301, #061507 55%, #010301);
      font-family: Arial, Helvetica, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(57, 255, 20, 0.16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57, 255, 20, 0.16) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--border);
      background: rgba(1, 7, 2, 0.9);
      backdrop-filter: blur(14px);
    }

    .nav {
      width: min(1200px, 92%);
      min-height: 72px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: var(--neon);
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: 2px;
      white-space: nowrap;
      text-shadow:
        0 0 8px var(--neon),
        0 0 25px var(--neon);
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .nav-button,
    .outline-button,
    .play-button,
    .close-button,
    .fullscreen-button {
      color: var(--neon);
      border: 1px solid var(--neon);
      border-radius: 9px;
      background: rgba(57, 255, 20, 0.07);
      transition: 0.2s ease;
    }

    .nav-button {
      padding: 9px 13px;
      font-size: 0.82rem;
    }

    button:hover {
      color: #001000;
      background: var(--neon);
      box-shadow: 0 0 18px rgba(57, 255, 20, 0.75);
      transform: translateY(-2px);
    }

    main {
      width: min(1200px, 92%);
      margin: auto;
    }

    .hero {
      min-height: 455px;
      display: grid;
      place-items: center;
      padding: 80px 0 65px;
      text-align: center;
    }

    .hero-content {
      max-width: 850px;
    }

    .badge {
      display: inline-block;
      margin-bottom: 22px;
      padding: 8px 14px;
      color: var(--neon);
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(57, 255, 20, 0.08);
      font-size: 0.76rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      color: var(--neon);
      font-size: clamp(4rem, 11vw, 8.5rem);
      line-height: 0.87;
      letter-spacing: -7px;
      text-shadow:
        0 0 8px var(--neon),
        0 0 26px var(--neon),
        0 0 65px rgba(57, 255, 20, 0.7);
    }

    .hero p {
      max-width: 650px;
      margin: 26px auto;
      color: #d5ecd6;
      font-size: 1.08rem;
      line-height: 1.6;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hero-button {
      padding: 13px 20px;
      color: #001000;
      border: 1px solid var(--neon);
      border-radius: 9px;
      background: var(--neon);
      font-weight: bold;
      transition: 0.2s ease;
    }

    .outline-button {
      padding: 13px 20px;
      font-weight: bold;
    }

    .section-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 30px 0 18px;
    }

    .section-header h2 {
      color: var(--neon);
      font-size: 1.8rem;
      text-shadow: 0 0 12px rgba(57, 255, 20, 0.55);
    }

    .section-header span {
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .controls {
      display: flex;
      gap: 9px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    #search {
      flex: 1;
      min-width: 230px;
      padding: 13px 15px;
      outline: none;
      color: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(4, 17, 6, 0.95);
    }

    #search::placeholder {
      color: #729775;
    }

    #search:focus {
      border-color: var(--neon);
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.35);
    }

    .filter-button {
      padding: 11px 14px;
      cursor: pointer;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(57, 255, 20, 0.05);
      transition: 0.2s ease;
    }

    .filter-button.active {
      color: #001000;
      background: var(--neon);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(225px, 1fr));
      gap: 16px;
      padding-bottom: 75px;
    }

    .game-card {
      position: relative;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background:
        linear-gradient(145deg, rgba(57, 255, 20, 0.12), transparent 45%),
        var(--panel);
      box-shadow: inset 0 0 30px rgba(57, 255, 20, 0.025);
      transition: 0.25s ease;
    }

    .game-card:hover {
      border-color: var(--neon);
      box-shadow:
        0 0 22px rgba(57, 255, 20, 0.22),
        inset 0 0 30px rgba(57, 255, 20, 0.06);
      transform: translateY(-5px);
    }

    .game-number {
      position: absolute;
      top: 14px;
      right: 16px;
      color: rgba(57, 255, 20, 0.45);
      font-size: 0.8rem;
      font-weight: bold;
    }

    .game-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin-bottom: 17px;
      color: var(--neon);
      border: 1px solid var(--neon);
      border-radius: 14px;
      background: rgba(57, 255, 20, 0.08);
      font-size: 1.8rem;
      box-shadow: 0 0 18px rgba(57, 255, 20, 0.2);
    }

    .game-card h3 {
      margin-bottom: 8px;
      color: white;
      font-size: 1.13rem;
    }

    .game-card p {
      min-height: 44px;
      color: var(--text-muted);
      font-size: 0.87rem;
      line-height: 1.45;
    }

    .game-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
    }

    .tag {
      color: var(--neon);
      font-size: 0.72rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .play-button {
      padding: 9px 12px;
      font-size: 0.78rem;
      font-weight: bold;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 45px;
      color: var(--text-muted);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    footer {
      padding: 30px 20px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.83rem;
    }

    .game-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      flex-direction: column;
      background: #000;
    }

    .game-modal.open {
      display: flex;
    }

    .modal-bar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      color: var(--neon);
      border-bottom: 1px solid var(--border);
      background: #030803;
    }

    .modal-title {
      overflow: hidden;
      font-weight: bold;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
    }

    .close-button,
    .fullscreen-button {
      padding: 8px 11px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    #gameFrame {
      width: 100%;
      height: calc(100vh - 58px);
      border: 0;
      background: #000;
    }

    @media (max-width: 650px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px 0;
      }

      .nav-buttons {
        justify-content: flex-start;
      }

      h1 {
        letter-spacing: -3px;
      }

      .hero {
        min-height: 390px;
        padding-top: 55px;
      }

      .section-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 7px;
      }

      .modal-bar {
        min-height: 66px;
      }

      #gameFrame {
        height: calc(100vh - 66px);
      }
    }
  </style>
</head>

        <button class="filter-button" onclick="setCategory('puzzle', this)">

        </button>
      </div>

      <div id="gameGrid" class="game-grid"></div>
    </section>
  </main>

  <footer>
    94 Games © 2026 — Only host games that you are authorized to redistribute.
  </footer>

  <div id="gameModal" class="game-modal">

        <button class="close-button" onclick="closeGame()">
          Close
        </button>
      </div>
    </div>

    <iframe
      id="gameFrame"
      title="Game"
      allow="fullscreen; autoplay; gamepad"
      allowfullscreen>
    </iframe>
  </div>

    let selectedCategory = "all";

    function renderGames() {
      const grid = document.getElementById("gameGrid");
      const search = document.getElementById("search");
      const searchTerm = search.value.toLowerCase().trim();

      const visibleGames = games.filter((game) => {
        const categoryMatch =
          selectedCategory === "all" ||
          game.category === selectedCategory;

        const searchMatch =
          game.name.toLowerCase().includes(searchTerm) ||
          game.description.toLowerCase().includes(searchTerm);

        return categoryMatch && searchMatch;
      });

      document.getElementById("gameCount").textContent =
        `${visibleGames.length} game${visibleGames.length === 1 ? "" : "s"} available`;

      if (visibleGames.length === 0) {
        grid.innerHTML = `
          <div class="empty">
            No games found. Try a different search.
          </div>
        `;
        return;
      }

      grid.innerHTML = visibleGames
        .map((game) => {
          const number = games.indexOf(game) + 1;

          return `
            <article class="game-card">
              <div>
                <span class="game-number">
                  #${String(number).padStart(2, "0")}
                </span>

                <div class="game-icon">${game.icon}</div>

                <h3>${escapeHtml(game.name)}</h3>

                <p>${escapeHtml(game.description)}</p>
              </div>

              <div class="game-footer">
                <span class="tag">${escapeHtml(game.category)}</span>

                <button
                  class="play-button"
                  onclick="launchGame(${number - 1})">
                  PLAY
                </button>
              </div>
            </article>
          `;
        })
        .join("");
    }

    function launchGame(index) {
      const game = games[index];

      if (!game.url) {
        alert(
          `${game.name} does not have a game URL yet. Add its authorized GitHub Pages URL in the games array.`
        );
        return;
      }

      const modal = document.getElementById("gameModal");
      const frame = document.getElementById("gameFrame");
      const title = document.getElementById("modalTitle");

      title.textContent = game.name;
      frame.src = game.url;
      modal.classList.add("open");

      document.body.style.overflow = "hidden";
    }

    function closeGame() {
      const modal = document.getElementById("gameModal");
      const frame = document.getElementById("gameFrame");

      frame.src = "";
      modal.classList.remove("open");

      document.body.style.overflow = "";
    }

    function fullscreenGame() {
      const frame = document.getElementById("gameFrame");

      if (frame.requestFullscreen) {
        frame.requestFullscreen();
      } else if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
      }
    }

    function setCategory(category, button) {
      selectedCategory = category;

      document.querySelectorAll(".filter-button").forEach((item) => {
        item.classList.remove("active");
      });

      button.classList.add("active");
      renderGames();
    }

    function scrollToGames() {
      document.getElementById("games").scrollIntoView({
        behavior: "smooth"
      });
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    }

    function openHubAboutBlank() {
      const newWindow = window.open("about:blank", "_blank");

      if (!newWindow) {
        alert("Your browser blocked the new tab. Allow pop-ups for this site.");
        return;
      }

      newWindow.document.write(`
        <!DOCTYPE html>
        <html>
          <head>
            <title>94 Games</title>

                text-align: center;

              h1 {
                font-size: 5rem;
                text-shadow:
                  0 0 10px #39ff14,
                  0 0 30px #39ff14;
              }

              p {
                color: #b9d9bb;
              }
            </style>
          </head>

          <body>
            <div>
              <h1>94 GAMES</h1>
              <p>Neon arcade hub launched.</p>
            </div>
          </body>
        </html>
      `);

      newWindow.document.close();
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeGame();
      }
    });

    renderGames();
  </script>
